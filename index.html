<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bear Hug 🧸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeaff;--bg2:#fde8f1;--ink:#3a2a5c;--soft:#6d5d8f;--butter:#ffd45e;--mint:#6fd8b4;--berry:#ff7a9c;--grape:#a98bff;--paper:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);line-height:1.5;text-align:center;
  background:linear-gradient(180deg,var(--bg),var(--bg2));min-height:100vh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 30px);
  transition:background .8s;
}
body.warm{background:linear-gradient(180deg,#ffe9d6,#ffd3e2)}
main{max-width:480px;margin:0 auto}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;color:var(--soft);text-decoration:none;font-size:.95rem}
.snd{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:60;width:44px;height:44px;font-size:1.3rem;
  background:var(--paper);border:3px solid var(--ink);border-radius:50%;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
h1{font-size:2.5rem;font-weight:600;line-height:1.1;margin-top:46px}
.for{font-family:"Caveat",cursive;font-size:1.7rem;font-weight:600;color:var(--soft)}
.lead{color:var(--soft);margin:6px 0 10px}

.holdbtn{
  display:block;margin:6px auto 0;width:min(320px,86vw);background:none;border:0;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.holdbtn:focus-visible{outline:4px solid var(--grape);outline-offset:6px;border-radius:30px}
#bear{width:100%;height:auto;display:block;overflow:visible}
.bearg{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1);animation:breathe 3.5s ease-in-out infinite}
.hugging .bearg{transform:scale(1.07,.94);animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.99)}}
.arm{transform-box:fill-box;transform-origin:50% 15%;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.arm.l{transform:rotate(14deg)}
.arm.r{transform:rotate(-14deg)}
.hugging .arm.l{transform:rotate(-72deg)}
.hugging .arm.r{transform:rotate(72deg)}
.eyes-happy,.cheek{opacity:0;transition:opacity .3s}
.hugging .eyes-happy{opacity:1}
.hugging .eyes-open{opacity:0}
.hugging .cheek{opacity:.65}

.meter{height:16px;max-width:260px;margin:14px auto 12px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--butter),var(--berry))}
.status{position:relative;display:flex;align-items:center;justify-content:center;max-width:340px;min-height:3.4em;margin:14px auto 12px;padding:10px 18px;
  font-family:"Caveat",cursive;font-weight:600;font-size:1.75rem;line-height:1.2;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink)}
.status:empty{visibility:hidden}
.status::before{content:"";position:absolute;left:50%;top:-11px;width:16px;height:16px;margin-left:-8px;background:var(--paper);border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg)}
.next{color:var(--soft);font-size:.95rem;margin-bottom:6px}
.slot.gold{background:radial-gradient(circle at 50% 70%,rgba(255,212,94,.7),transparent 70%)}
.toast.gold{background:var(--butter)}
.count{display:inline-block;margin:0 auto 6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 18px;font-weight:500;box-shadow:0 3px 0 var(--ink)}
.count b{font-size:1.3rem}
.count.bump{animation:bump .45s}
@keyframes bump{50%{transform:scale(1.2)}}
.reward{min-height:5.2em;font-size:1.1rem;margin:0 0 4px}
.reward .big{font-size:2.6rem;display:block;line-height:1.2;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;top:40%;z-index:70;max-width:84vw;min-width:230px;text-align:center;pointer-events:none;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px 26px;box-shadow:0 7px 0 var(--ink);
  opacity:0;transform:translate(-50%,-50%) scale(.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .big{display:block;font-size:3.8rem;line-height:1.1}
.toast .t1{font-family:"Caveat",cursive;font-weight:600;font-size:1.9rem;line-height:1.15}
.toast .t2{color:var(--soft);font-size:.95rem}
.shelfwrap{margin-top:22px}
.shelfwrap h2{font-size:1.5rem;font-weight:600}
.shelf{border:3px solid var(--ink);border-radius:18px;background:#fbf1e6;box-shadow:0 5px 0 var(--ink);overflow:hidden;padding:0 10px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:12px solid #c98b5a;margin:0 -10px;padding:0 10px}
.row + .row{border-top:2px solid rgba(58,42,92,.15)}
.slot{height:68px;display:flex;align-items:flex-end;justify-content:center;font-size:2.4rem;line-height:1;padding-bottom:2px;cursor:pointer}
.slot.empty{cursor:default}
.slot.empty::after{content:"";width:32px;height:32px;border:2px dashed rgba(58,42,92,.25);border-radius:50%;margin-bottom:10px}
.slot.new span{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}

.bit{position:fixed;z-index:50;pointer-events:none;font-size:1.5rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="back" href="index.html">← back</a>
<button class="snd" id="snd" aria-label="Sound on" aria-pressed="true">🔊</button>

<main>
  <h1>The Bear Hug</h1>
  <p class="for" id="for"></p>
  <p class="lead" id="lead"></p>

  <button class="holdbtn" id="hold" aria-label="Press and hold to hug the bear">
    <svg id="bear" viewBox="0 0 300 320" aria-hidden="true">
      <g class="bearg">
        <ellipse cx="150" cy="306" rx="95" ry="9" fill="rgba(58,42,92,.15)"/>
        <g stroke="#3a2a5c" stroke-width="4">
          <circle cx="88" cy="68" r="30" fill="#c98b5a"/><circle cx="212" cy="68" r="30" fill="#c98b5a"/>
          <ellipse cx="150" cy="224" rx="78" ry="72" fill="#c98b5a"/>
          <ellipse cx="150" cy="236" rx="44" ry="46" fill="#f6d7b8"/>
          <circle cx="150" cy="118" r="70" fill="#c98b5a"/>
          <ellipse cx="150" cy="140" rx="31" ry="24" fill="#f6d7b8"/>
        </g>
        <circle cx="88" cy="68" r="14" fill="#f3b9a0"/><circle cx="212" cy="68" r="14" fill="#f3b9a0"/>
        <ellipse cx="150" cy="128" rx="9" ry="6" fill="#3a2a5c"/>
        <path d="M150 134v8M150 142q-9 8-17 0M150 142q9 8 17 0" fill="none" stroke="#3a2a5c" stroke-width="3.5" stroke-linecap="round"/>
        <g class="eyes-open" fill="#3a2a5c"><circle cx="121" cy="106" r="7"/><circle cx="179" cy="106" r="7"/></g>
        <g class="eyes-happy" fill="none" stroke="#3a2a5c" stroke-width="4" stroke-linecap="round">
          <path d="M112 108q9-12 18 0"/><path d="M170 108q9-12 18 0"/></g>
        <circle class="cheek" cx="104" cy="132" r="9" fill="#ff7a9c"/><circle class="cheek" cx="196" cy="132" r="9" fill="#ff7a9c"/>
        <text x="150" y="252" font-size="34" text-anchor="middle">💛</text>
        <ellipse class="arm l" cx="82" cy="216" rx="24" ry="52" fill="#c98b5a" stroke="#3a2a5c" stroke-width="4"/>
        <ellipse class="arm r" cx="218" cy="216" rx="24" ry="52" fill="#c98b5a" stroke="#3a2a5c" stroke-width="4"/>
      </g>
    </svg>
  </button>

  <div class="meter" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <p class="status" id="status" aria-live="polite"></p>
  <p class="count" id="count" aria-live="polite">Hugs given: <b id="n">0</b></p>
  <p class="next" id="next"></p>
  <p class="reward" id="reward" aria-live="polite"></p>

  <div class="shelfwrap">
    <h2>Your shelf 🎀</h2>
    <p class="lead" id="shelfLead"></p>
    <div class="shelf" id="shelf"></div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="big" id="tBig"></span>
  <p class="t1" id="tText"></p>
  <p class="t2" id="tSub"></p>
</div>

<script>
/* ========== EDIT THIS PART ========== */
const CONFIG = {
  name: "Trisha",
  holdSeconds: 3,
  lead: "Press and hold the bear. Don’t let go.",
  talks: [
    "There. A proper bear hug. 🧸",
    "I’m not going anywhere, anamcara. 💛",
    "Every bad day gets a hug from me. Always.",
    "You don’t have to say a thing. I’m listening.",
    "We’re not drifting apart. Promise. 🌙",
    "Talk as much as you want. I never get tired of listening.",
    "You’re doing better than you think.",
    "You’re allowed to rest. The world can wait.",
    "Whatever happened today, you’re not alone in it.",
    "You deserve to be happy. Not later. Today.",
    "Small steps still count. So do small hugs.",
    "Drink some water, little one. Bear’s orders. 💧",
    "Eat a green apple. Doctor Bear says so. 🍏",
    "You make people’s days better. Mine most of all.",
    "I’m proud of you. Yes, you. Right now.",
    "Be gentle with yourself today. You’d be gentle with me."
  ],
  milestones: [
    { at: 5,   e: "🥉", n: "a bronze hug medal",     title: "5 hugs!",   text: "Five hugs! You’re officially warmed up. 🔥" },
    { at: 10,  e: "🥈", n: "a silver hug medal",     title: "10 hugs!",  text: "Ten hugs! The bear is getting attached to you. 🧸" },
    { at: 25,  e: "🥇", n: "a gold hug medal",       title: "25 hugs!",  text: "Twenty-five hugs! You’re a hug expert now. 💛" },
    { at: 50,  e: "🏆", n: "the Hug Champion trophy", title: "50 hugs!",  text: "Fifty hugs! You’re officially fully charged. ⚡" },
    { at: 100, e: "👑", n: "a golden crown",          title: "100 hugs!", text: "One hundred hugs! The bear bows to you. 👑" }
  ],
  rewards: [
    { e: "🍫", n: "a chocolate" },      { e: "🌹", n: "a red rose" },
    { e: "🌻", n: "a sunflower" },      { e: "🍏", n: "a green apple" },
    { e: "🧸", n: "a tiny bear" },      { e: "🎁", n: "a surprise gift" },
    { e: "💐", n: "a bouquet" },        { e: "🧁", n: "a cupcake" },
    { e: "🌙", n: "a little moon" },    { e: "⭐", n: "a shiny star" },
    { e: "🍪", n: "a warm cookie" },    { e: "💛", n: "your golden heart" },
    { e: "🌸", n: "a cherry blossom" }, { e: "🍓", n: "a strawberry" },
    { e: "🍭", n: "a lollipop" },       { e: "🎀", n: "a pretty ribbon" }
  ]
};
/* ==================================== */

const $ = id => document.getElementById(id);
const DUR = CONFIG.holdSeconds * 1000;
const ALL = CONFIG.rewards.concat(CONFIG.milestones.map(m => ({ e: m.e, n: m.n, m: true })));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("for").textContent = "for " + CONFIG.name;
$("lead").textContent = CONFIG.lead;
$("status").textContent = "";

/* shelf: every finished hug adds one reward, kept on this device */
let shelf = [], lastIdx = -1;
try { shelf = JSON.parse(localStorage.getItem("bearShelf") || "[]"); } catch (e) { shelf = []; }
if (!Array.isArray(shelf)) shelf = [];
shelf = shelf.filter(i => Number.isInteger(i) && ALL[i]);
function saveShelf() { try { localStorage.setItem("bearShelf", JSON.stringify(shelf)); } catch (e) {} }
function updateNext() {
  const n = shelf.length, nm = CONFIG.milestones.find(m => m.at > n);
  $("next").textContent = nm
    ? (nm.at - n) + (nm.at - n === 1 ? " more hug" : " more hugs") + " until a special reward " + nm.e
    : "You’ve unlocked every milestone. Keep hugging anyway 💛";
}
function renderShelf(newK) {
  const el = $("shelf"), rows = Math.max(2, Math.ceil((shelf.length + 1) / 4));
  el.innerHTML = "";
  for (let r = 0; r < rows; r++) {
    const row = document.createElement("div"); row.className = "row";
    for (let c = 0; c < 4; c++) {
      const k = r * 4 + c, slot = document.createElement("div");
      slot.className = "slot";
      if (k < shelf.length) {
        const it = ALL[shelf[k]], sp = document.createElement("span");
        sp.textContent = it.e; slot.appendChild(sp);
        slot.title = it.n; slot.setAttribute("aria-label", it.n);
        if (k === newK) slot.classList.add("new");
        if (it.m) slot.classList.add("gold");
        slot.onclick = () => { $("reward").textContent = it.e + "  " + it.n; };
      } else slot.classList.add("empty");
      row.appendChild(slot);
    }
    el.appendChild(row);
  }
  $("n").textContent = shelf.length;
  updateNext();
  $("shelfLead").textContent = shelf.length
    ? "Every hug adds something here. Tap one to see what it is."
    : "Every hug you give adds something here.";
}
renderShelf();

/* sound (only after a tap) */
let actx = null, soundOn = true, hum = null;
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; }
function startHum() {
  if (!soundOn) return;
  const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = "sine";
  o.frequency.setValueAtTime(196, t); o.frequency.linearRampToValueAtTime(294, t + DUR / 1000);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06, t + 0.4);
  o.connect(g); g.connect(c.destination); o.start(); hum = { o, g, c };
}
function stopHum() {
  if (!hum) return;
  const { o, g, c } = hum, t = c.currentTime;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
  g.gain.linearRampToValueAtTime(0.0001, t + 0.25); o.stop(t + 0.3); hum = null;
}
function chime() {
  if (!soundOn) return;
  const c = ctx();
  [523, 659, 784, 1047].forEach((f, k) => {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + k * 0.11;
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.65);
  });
}
$("snd").onclick = () => {
  soundOn = !soundOn; if (!soundOn) stopHum();
  $("snd").textContent = soundOn ? "🔊" : "🔇";
  $("snd").setAttribute("aria-pressed", soundOn);
  $("snd").setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
};

/* hearts */
function burst(x, y) {
  if (reduce) return;
  const bits = ["💛", "💖", "🧸", "✨", "🌙"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.className = "bit"; s.textContent = bits[i % bits.length];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
    s.style.setProperty("--r", (Math.random() * 100 - 50) + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1100);
  }
}

/* hold to hug */
let lastTalk = -1, toastTimer = 0, holding = false, done = false, t0 = 0, raf = 0, msgIndex = 0;
function frame() {
  if (!holding) return;
  const p = Math.min((performance.now() - t0) / DUR, 1);
  $("fill").style.width = (p * 100) + "%";
  if (p >= 1) { complete(); return; }
  raf = requestAnimationFrame(frame);
}
function begin() {
  if (holding) return;
  holding = true; done = false; t0 = performance.now();
  document.body.classList.add("hugging");
  $("status").textContent = "Hugging… keep holding"; $("reward").textContent = "";
  startHum(); frame();
}
function complete() {
  done = true;
  document.body.classList.add("warm");
  const count = shelf.length + 1;
  const mk = CONFIG.milestones.findIndex(m => m.at === count), ms = mk >= 0 ? CONFIG.milestones[mk] : null;
  let idx;
  if (ms) idx = CONFIG.rewards.length + mk;
  else { do { idx = Math.floor(Math.random() * CONFIG.rewards.length); } while (idx === lastIdx && CONFIG.rewards.length > 1); lastIdx = idx; }
  let t; do { t = Math.floor(Math.random() * CONFIG.talks.length); } while (t === lastTalk && CONFIG.talks.length > 1); lastTalk = t;
  $("status").textContent = ms ? ms.text : CONFIG.talks[t];
  shelf.push(idx); saveShelf(); renderShelf(shelf.length - 1);
  const it = ALL[idx], rw = $("reward"), big = document.createElement("span");
  big.className = "big"; big.textContent = it.e;
  rw.textContent = ""; rw.appendChild(big);
  rw.appendChild(document.createTextNode(ms ? "Milestone reward: " + it.n + "!" : "You got " + it.n + ". It’s on your shelf now."));
  $("tBig").textContent = it.e;
  $("tText").textContent = ms ? ms.title : "You got " + it.n + "!";
  $("tSub").textContent = ms ? "You earned " + it.n + ". It’s on your shelf 🎀" : "It’s on your shelf now 🎀";
  $("toast").classList.toggle("gold", !!ms);
  $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), ms ? 4800 : 3400);
  $("count").classList.remove("bump"); void $("count").offsetWidth; $("count").classList.add("bump");
  chime();
  if (navigator.vibrate) navigator.vibrate(ms ? [60, 60, 60, 60, 120] : [40, 60, 40]);
  const r = $("hold").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  burst(cx, cy);
  if (ms) { setTimeout(() => burst(cx - 70, cy - 40), 250); setTimeout(() => burst(cx + 70, cy - 40), 500); }
}
function end() {
  if (!holding) return;
  holding = false; cancelAnimationFrame(raf); stopHum();
  document.body.classList.remove("hugging");
  if (!done) $("status").textContent = "Aww, a little longer next time…";
  setTimeout(() => { if (!holding) { $("fill").style.width = "0"; document.body.classList.remove("warm"); } }, done ? 900 : 0);
}
const hb = $("hold");
hb.addEventListener("pointerdown", e => { e.preventDefault(); try { hb.setPointerCapture(e.pointerId); } catch (x) {} begin(); });
["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => hb.addEventListener(ev, end));
hb.addEventListener("contextmenu", e => e.preventDefault());
hb.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); begin(); } });
hb.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") end(); });
</script>
</body>
</html>
